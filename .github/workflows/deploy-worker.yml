name: Deploy worker

# Deploys the Worker and, on request, builds the card database.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   a token with Workers Scripts:Edit, D1:Edit, R2:Edit
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard URL
#   D1_DATABASE_ID         uuid of the cardscan D1 database
#   WORKER_ADMIN_TOKEN     the token the /admin routes check
#
# The database id is a secret here rather than a committed value because this
# repository is public and the id names a resource in a specific account.

on:
  workflow_dispatch:
    inputs:
      migrate:
        description: Apply D1 migrations before deploying
        type: boolean
        default: true
      refresh:
        description: Build the card database after deploying
        type: boolean
        default: true
      games:
        description: Games to import (space separated, or "all")
        default: 'onepiece pokemon'

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: worker

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Check the secrets are set
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }

      - run: npm ci

      - name: Generate the wrangler config
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          test -n "${D1_DATABASE_ID:-}" || { echo "D1_DATABASE_ID is not set"; exit 1; }
          ./scripts/config.sh

      - name: Test before deploying
        run: npm run typecheck && npm test

      - name: Apply migrations
        if: inputs.migrate
        run: npx wrangler d1 migrations apply cardscan --remote --config wrangler.generated.toml

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.generated.toml 2>&1 | tee deploy.log
          url="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the card database
        if: inputs.refresh
        env:
          WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          GAMES: ${{ inputs.games }}
        run: |
          set -euo pipefail
          test -n "${WORKER_ADMIN_TOKEN:-}" || { echo "WORKER_ADMIN_TOKEN is not set"; exit 1; }
          test -n "${WORKER_URL:-}" || { echo "Could not read the deployed URL"; exit 1; }

          games="$GAMES"
          [ "$games" = "all" ] && games="onepiece pokemon mtg yugioh lorcana"

          for game in $games; do
            echo "::group::$game"
            # The import walks every set in the game one request per second, so
            # give it room.
            curl --fail-with-body --silent --show-error --max-time 3600 \
              -X POST "${WORKER_URL}/admin/refresh?game=${game}" \
              -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}" | tee "refresh-${game}.json"
            echo
            echo "::endgroup::"
          done

          {
            echo "### Card database"
            echo
            echo '```json'
            cat refresh-*.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
