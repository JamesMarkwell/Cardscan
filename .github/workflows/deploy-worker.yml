name: Deploy worker

# Deploys the Worker and, on request, builds the card database.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   a token with Workers Scripts:Edit, D1:Edit, R2:Edit
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard URL
#   D1_DATABASE_ID         uuid of the cardscan D1 database
#   WORKER_ADMIN_TOKEN     the token the /admin routes check
#
# The database id is a secret here rather than a committed value because this
# repository is public and the id names a resource in a specific account.

on:
  workflow_dispatch:
    inputs:
      migrate:
        description: Apply D1 migrations before deploying
        type: boolean
        default: true
      refresh:
        description: Build the card database after deploying
        type: boolean
        default: true
      games:
        description: Games to import (space separated, or "all")
        default: 'onepiece pokemon'

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: worker

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Check the secrets are set
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID WORKER_ADMIN_TOKEN; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "See the README section 'Deploying from GitHub Actions'."
            exit 1
          fi
          echo "All four secrets are present."

      - run: npm ci

      - name: Confirm the credentials work
        run: npx wrangler whoami

      - name: Generate the wrangler config
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          test -n "${D1_DATABASE_ID:-}" || { echo "D1_DATABASE_ID is not set"; exit 1; }
          ./scripts/config.sh

      - name: Test before deploying
        run: npm run typecheck && npm test

      - name: Apply migrations
        if: inputs.migrate
        run: npx wrangler d1 migrations apply cardscan --remote --config wrangler.generated.toml

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.generated.toml 2>&1 | tee deploy.log
          url="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Set the Worker's admin token
        # After the deploy: `wrangler secret put` needs the Worker to exist.
        # Secrets apply immediately, so no second deploy is needed.
        env:
          WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          # Idempotent: overwrites the stored secret with the same value.
          printf '%s' "$WORKER_ADMIN_TOKEN" \
            | npx wrangler secret put WORKER_ADMIN_TOKEN --config wrangler.generated.toml

      - name: Build the card database
        if: inputs.refresh
        env:
          WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          GAMES: ${{ inputs.games }}
        run: |
          set -euo pipefail
          test -n "${WORKER_ADMIN_TOKEN:-}" || { echo "WORKER_ADMIN_TOKEN is not set"; exit 1; }
          test -n "${WORKER_URL:-}" || { echo "Could not read the deployed URL"; exit 1; }

          games="$GAMES"
          [ "$games" = "all" ] && games="onepiece pokemon mtg yugioh lorcana"

          # The import runs a few sets per request to stay under Cloudflare's
          # per-invocation subrequest limit, and reports whether more remain, so
          # each game is driven by calling it until the response says done. Each
          # call is a fresh Worker invocation with its own budget.
          for game in $games; do
            echo "::group::$game"
            batch=0
            while :; do
              batch=$((batch + 1))
              resp="$(curl --fail-with-body --silent --show-error --max-time 300 \
                -X POST "${WORKER_URL}/admin/refresh?game=${game}" \
                -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}")"
              echo "$resp" | tee "refresh-${game}.json"
              echo
              done="$(printf '%s' "$resp" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).done))}catch{process.stdout.write("error")}})')"
              case "$done" in
                true) break ;;
                false) ;;
                *) echo "Unexpected refresh response for ${game}"; exit 1 ;;
              esac
              if [ "$batch" -ge 500 ]; then echo "Gave up on ${game} after ${batch} batches"; exit 1; fi
            done
            echo "::endgroup::"
          done

          {
            echo "### Card database"
            echo
            echo '```json'
            cat refresh-*.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
