name: Fingerprint new cards

on:
  schedule:
    # An hour after the Worker's 21:00 UTC refresh, so new printings exist.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      games:
        description: Space-separated games, or "all"
        default: all
      version:
        description: Catalog version (YYYYMMDD). Blank uses the manifest's current version.
        default: ''

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Cache CollectorVision models
        uses: actions/cache@v4
        with:
          path: ~/.cache/collectorvision
          key: collectorvision-models-v1

      - name: Fingerprint
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GAMES: ${{ inputs.games || 'all' }}
          CATALOG_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GAMES" = "all" ]; then
            GAMES="onepiece pokemon mtg yugioh lorcana"
          fi
          # One game at a time keeps the download rate on image hosts polite.
          for game in $GAMES; do
            echo "::group::$game"
            if [ -n "$CATALOG_VERSION" ]; then
              python fingerprint_job.py --game "$game" --version "$CATALOG_VERSION"
            else
              python fingerprint_job.py --game "$game"
            fi
            echo "::endgroup::"
          done
