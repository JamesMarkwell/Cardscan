name: Android

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        default: release
        type: choice
        options: [debug, release]
      architectures:
        description: Architectures to build (comma separated)
        default: arm64-v8a
        type: string

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app

    env:
      # Phones shipped in the last decade are arm64. Pushes build just that one;
      # use "Run workflow" with all four when a wider set is needed.
      ARCHITECTURES: ${{ inputs.architectures || 'arm64-v8a' }}
      VARIANT: ${{ inputs.variant || 'debug' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check the runner's Android SDK
        # The ubuntu-latest image ships the SDK already. android-actions/setup-android
        # is not used: it installs the long-removed "tools" package and fails.
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo "ANDROID_HOME is not set"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Generate the native project
        # Continuous native generation: android/ is not committed, it is
        # regenerated from app.json so the config stays the single source.
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Assemble
        working-directory: app/android
        run: |
          set -euo pipefail
          task="assemble$(python3 -c "print('${VARIANT}'.capitalize())")"
          ./gradlew "$task" \
            -PreactNativeArchitectures="${ARCHITECTURES}" \
            --no-daemon --stacktrace

      - name: Report APK sizes
        run: |
          set -euo pipefail
          {
            echo "### ${VARIANT} APKs (${ARCHITECTURES})"
            echo
            echo "| APK | Size |"
            echo "| --- | ---- |"
            find android/app/build/outputs/apk -name '*.apk' -printf '| %f | %s |\n' \
              | awk -F'|' '{printf "|%s|%.1f MB |\n", $2, $3/1048576}'
          } >> "$GITHUB_STEP_SUMMARY"
          find android/app/build/outputs/apk -name '*.apk' -exec ls -lh {} +

      - uses: actions/upload-artifact@v4
        with:
          name: cardscan-${{ inputs.variant || 'debug' }}-apk
          path: app/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
