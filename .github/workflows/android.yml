name: Android

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        default: debug
        type: choice
        options: [debug, release]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check the runner's Android SDK
        # The ubuntu-latest image ships the SDK already. android-actions/setup-android
        # is not used: it installs the long-removed "tools" package and fails.
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo "ANDROID_HOME is not set"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Generate the native project
        # Continuous native generation: android/ is not committed, it is
        # regenerated from app.json so the config stays the single source.
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Assemble ${{ inputs.variant || 'debug' }} APK
        working-directory: app/android
        run: ./gradlew assemble${{ inputs.variant == 'release' && 'Release' || 'Debug' }} --no-daemon --stacktrace

      - name: Name the artifact
        id: apk
        run: echo "path=$(find android/app/build/outputs/apk -name '*.apk' | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: cardscan-${{ inputs.variant || 'debug' }}-apk
          path: app/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
