name = "cardscan-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# The refresh imports a few sets per invocation to stay under Cloudflare's
# per-invocation subrequest limit, working through a game over successive ticks.
# Hourly (not every 10 min) keeps the D1 read load and contention low — an
# aggressive cadence re-imports the large catalogs often enough to crowd out
# other queries (e.g. the fingerprint job) on the free tier. A tick with nothing
# due is a cheap no-op. Built games are refreshed about once a day (see
# REFRESH_STALE_MS in src/index.ts).
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "cardscan"
database_id = "replace-me-after-wrangler-d1-create"

[[r2_buckets]]
binding = "PACKS"
bucket_name = "cardscan-packs"

[vars]
USER_AGENT = "CardScan/0.1 (+https://github.com/JamesMarkwell/cardscan)"
# Left blank: the manifest then uses the origin of the incoming request, so a
# fresh deploy works straight away. Set it only for a custom domain.
PUBLIC_BASE_URL = ""
# Politeness: how long to wait between requests to the same source host.
SOURCE_MIN_INTERVAL_MS = "1000"

# WORKER_ADMIN_TOKEN is a secret: wrangler secret put WORKER_ADMIN_TOKEN
